[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logo-fetcher"
version = "1.0.0"
description = "A professional library for fetching company logos from multiple sources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Logo Fetcher Contributors" }
]
keywords = [
    "logo",
    "brand",
    "fetch",
    "api",
    "scraper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
all = [
    "logo-fetcher[api,cli,dev]",
]

[project.scripts]
logo-fetcher = "cli.main:app"

[project.urls]
Homepage = "https://github.com/yourusername/logo-fetcher"
Documentation = "https://github.com/yourusername/logo-fetcher#readme"
Repository = "https://github.com/yourusername/logo-fetcher"
Issues = "https://github.com/yourusername/logo-fetcher/issues"

[tool.hatch.build.targets.wheel]
packages = ["src", "api", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
